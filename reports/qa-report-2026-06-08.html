<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Report — 2026-06-08</title>
  <style>
    :root {
      --bg: #f7f9fc; --card: #fff; --ink: #18202a; --muted: #5b6675;
      --border: #d9e0ea; --brand: #4f46e5; --brandSoft: #eef2ff;
      --ok: #067647; --okBg: #ecfdf3; --danger: #b42318; --dangerBg: #fef3f2;
      --warn: #9a6700; --warnBg: #fffaeb;
      --electric: #3b82f6; --violet: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg); }
    .container { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 26px; margin-bottom: 4px; }
    .meta { color: var(--muted); margin-bottom: 24px; font-size: 13px; }
    .verdict {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 15px;
      margin-bottom: 24px;
    }
    .verdict.pass { background: var(--okBg); color: var(--ok); border: 1px solid #a3e6c8; }
    .verdict.fail { background: var(--dangerBg); color: var(--danger); border: 1px solid #fecdca; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; text-align: center;
    }
    .stat .num { font-size: 28px; font-weight: 800; color: var(--brand); }
    .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    .stat.danger .num { color: var(--danger); }
    .stat.ok .num { color: var(--ok); }
    h2 { font-size: 18px; margin: 28px 0 12px; padding-top: 20px; border-top: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); font-weight: 650; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 650; }
    .badge.pass { background: var(--okBg); color: var(--ok); }
    .badge.fail { background: var(--dangerBg); color: var(--danger); }
    .failure-block { background: #111827; color: #f9fafb; padding: 12px 16px; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 12px; overflow-x: auto; margin: 8px 0 16px; white-space: pre-wrap; word-break: break-word; }
    .footer { margin-top: 32px; text-align: center; font-size: 11px; color: var(--muted); }
    .gradient-bar { height: 4px; background: linear-gradient(90deg, var(--electric), var(--violet)); border-radius: 2px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="gradient-bar"></div>
    <h1>🧪 QA Report</h1>
    <p class="meta">2026-06-08 03:51:31 · vlinknexora</p>
    <div class="verdict pass">
      ✅ READY_FOR_COMMIT
    </div>

    <div class="stats">
      <div class="stat ok"><div class="num">0</div><div class="label">Passed</div></div>
      <div class="stat "><div class="num">0</div><div class="label">Failed</div></div>
      <div class="stat"><div class="num">0</div><div class="label">Skipped</div></div>
      <div class="stat"><div class="num">0.0s</div><div class="label">Duration</div></div>
      <div class="stat ok"><div class="num">✓</div><div class="label">Build</div></div>
    </div>

    <h2>Test Suites</h2>
    <table>
      <thead><tr><th>Status</th><th>Suite</th><th>Passed</th><th>Failed</th><th>Time</th></tr></thead>
      <tbody>
        <tr>
          <td><span class="badge pass">PASS</span></td>
          <td>All Tests</td>
          <td>0</td>
          <td>0</td>
          <td>0.00s</td>
        </tr>
      </tbody>
    </table>



    <div class="footer">Generated by qa-report.cjs · Nexora QA Pipeline</div>
  </div>
</body>
</html>
