name: Frontend CI/CD - Nexora

on:
  push:
    branches:
      - master
      - main
      - staging
      - dev
      - feature/taxiq-pos  # NEW (Phase 3/11 — test2 environment)
  pull_request:
    branches:
      - master
      - main
      - staging
      - dev
      - feature/taxiq-pos  # NEW (Phase 3/11 — test2 environment)

env:
  REGISTRY: registry.digitalocean.com/vlinkdo-container-registry
  IMAGE_NAME: nexora-frontend

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    name: Resolve Deployment Environment
    outputs:
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      build_env: ${{ steps.resolve.outputs.build_env }}
      deploy_path: ${{ steps.resolve.outputs.deploy_path }}
      devops_path: ${{ steps.resolve.outputs.devops_path }}
    steps:
      - name: Resolve environment from branch
        id: resolve
        shell: bash
        run: |
          target_ref="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF}" ]; then
            target_ref="${GITHUB_BASE_REF}"
          fi

          case "$target_ref" in
            master|main)
              github_environment="PRODUCTION"
              build_env="production"
              # Docker image tags cannot contain `/`, but the devops repo
              # organizes manifests under argocd/<raw-branch>/. For master/main
              # both forms equal the target_ref string so they collapse to the
              # same value here.
              deploy_path="$target_ref"
              devops_path="$target_ref"
              ;;
            staging)
              github_environment="STAGING"
              build_env="staging"
              deploy_path="$target_ref"
              devops_path="$target_ref"
              ;;
            feature/taxiq-pos)        # NEW (Phase 3/11 — test2 environment)
              github_environment="TEST2"
              build_env="test2"
              # Sanitized tag (Docker rejects `/` in tags), branch-path for devops
              # (matches the seeded manifests in PR #64).
              deploy_path="taxiq-pos"
              devops_path="feature/taxiq-pos"
              ;;
            dev)
              github_environment="TEST"
              build_env="test"
              deploy_path="$target_ref"
              devops_path="$target_ref"
              ;;
            *)
              echo "Unsupported deployment branch: $target_ref" >&2
              exit 1
              ;;
          esac

          echo "github_environment=$github_environment" >> "$GITHUB_OUTPUT"
          echo "build_env=$build_env" >> "$GITHUB_OUTPUT"
          echo "deploy_path=$deploy_path" >> "$GITHUB_OUTPUT"
          echo "devops_path=$devops_path" >> "$GITHUB_OUTPUT"

          echo "Resolved $target_ref -> $github_environment / $build_env / deploy_path=$deploy_path / devops_path=$devops_path"

  validate-build:
    needs: resolve-environment
    runs-on: ubuntu-latest
    name: Validate Multi-Environment Build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all build modes
        run: |
          echo "Testing all supported build modes..."
          VITE_APP_ENV=development \
          VITE_API_BASE_URL=https://localhost:5005 \
          VITE_DATA_SOURCE=storage \
          VITE_ENABLE_DEMO_TOOLS=false \
          pnpm run build:dev
          rm -rf dist
          VITE_APP_ENV=test \
          VITE_API_BASE_URL=https://test-api.nexoratouch.com \
          VITE_DATA_SOURCE=api \
          VITE_ENABLE_DEMO_TOOLS=false \
          pnpm run build:test
          rm -rf dist
          VITE_APP_ENV=test2 \
          VITE_API_BASE_URL=https://test2-api.nexoratouch.com \
          VITE_DATA_SOURCE=api \
          VITE_ENABLE_DEMO_TOOLS=false \
          pnpm run build:test2
          rm -rf dist
          VITE_APP_ENV=staging \
          VITE_API_BASE_URL=https://staging-api.nexoratouch.com \
          VITE_DATA_SOURCE=api \
          VITE_ENABLE_DEMO_TOOLS=false \
          pnpm run build:staging
          rm -rf dist
          VITE_APP_ENV=production \
          VITE_API_BASE_URL=https://api.nexoratouch.com \
          VITE_DATA_SOURCE=api \
          VITE_ENABLE_DEMO_TOOLS=false \
          pnpm run build:prod
          echo "All environment builds successful!"

  build-and-push:
    needs:
      - resolve-environment
      - validate-build
    environment: ${{ needs.resolve-environment.outputs.github_environment }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    env:
      BUILD_ENV: ${{ needs.resolve-environment.outputs.build_env }}
      APP_ENV: ${{ vars.VITE_APP_ENV || needs.resolve-environment.outputs.build_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Digital Ocean CLI
        run: |
          sudo snap install doctl
          sudo snap connect doctl:dot-docker
          doctl version

      - name: Build Docker Image
        run: |
          echo "*********** Build Nexora Frontend ***********"
          export DIGITALOCEAN_ACCESS_TOKEN=${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          doctl auth init
          doctl registry login
          echo "Build environment: $BUILD_ENV"
          echo "GitHub environment: ${{ needs.resolve-environment.outputs.github_environment }}"
          docker build \
            --file ./Dockerfile \
            --build-arg BUILD_ENV="$BUILD_ENV" \
            --build-arg VITE_APP_ENV="$APP_ENV" \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_DATA_SOURCE="${{ vars.VITE_DATA_SOURCE }}" \
            --build-arg VITE_ENABLE_DEMO_TOOLS="${{ vars.VITE_ENABLE_DEMO_TOOLS }}" \
            --build-arg VITE_SENTRY_ENV="${{ vars.VITE_SENTRY_ENV }}" \
            --build-arg VITE_SENTRY_DSN="${{ secrets.VITE_SENTRY_DSN }}" \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="${{ vars.VITE_GOOGLE_MAPS_API_KEY }}" \
            --build-arg VITE_MAPBOX_TOKEN="${{ vars.VITE_MAPBOX_TOKEN }}" \
            --build-arg VITE_MAP_MARKER_ENGINE="${{ vars.VITE_MAP_MARKER_ENGINE }}" \
            --build-arg VITE_GOOGLE_MAPS_MAP_ID="${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}" \
            --build-arg VITE_VLINKPAY_WEB_URL_BASE="${{ vars.VITE_VLINKPAY_WEB_URL_BASE }}" \
            --tag $REGISTRY/$IMAGE_NAME:${{ needs.resolve-environment.outputs.deploy_path }}-${{ github.sha }} \
            --tag $REGISTRY/$IMAGE_NAME:${{ needs.resolve-environment.outputs.deploy_path }}-latest \
            .

      - name: Push Docker Image
        run: |
          echo "*********** Push Nexora Frontend ***********"
          docker push $REGISTRY/$IMAGE_NAME:${{ needs.resolve-environment.outputs.deploy_path }}-${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:${{ needs.resolve-environment.outputs.deploy_path }}-latest

  deploy:
    environment: ${{ needs.resolve-environment.outputs.github_environment }}
    if: github.event_name == 'push'
    needs:
      - resolve-environment
      - build-and-push
    runs-on: ubuntu-latest
    name: Deploy to ArgoCD
    steps:
      - name: Checkout ArgoCD Repository
        uses: actions/checkout@v4
        with:
          repository: "vlink-group/devops"
          token: ${{ secrets.GH_PAT }}
          path: "devops"
          ref: "argocd"

      - name: Update Deployment Manifest
        run: |
          echo "Updating deployment for Nexora Frontend"
          echo "Deploy path (tag): ${{ needs.resolve-environment.outputs.deploy_path }}, devops path: ${{ needs.resolve-environment.outputs.devops_path }}, SHA: ${{ github.sha }}"
          sed -i 's|:${{ needs.resolve-environment.outputs.deploy_path }}-.*|:${{ needs.resolve-environment.outputs.deploy_path }}-${{ github.sha }}|g' devops/argocd/${{ needs.resolve-environment.outputs.devops_path }}/app-nexora-frontend/deployment.yaml

      - name: Commit and Push Changes
        run: |
          cd devops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update Nexora Frontend ${{ needs.resolve-environment.outputs.devops_path }} image to ${{ github.sha }}"
          git push
