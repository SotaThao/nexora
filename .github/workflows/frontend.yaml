name: Frontend CI/CD - Crypto Map 360

on:
  push:
    branches:
      - master
      - main
      - staging
      - dev
  pull_request:
    branches:
      - master
      - main
      - staging
      - dev

env:
  REGISTRY: registry.digitalocean.com/vlinkdo-container-registry
  IMAGE_NAME: nexora-frontend

jobs:
  validate-build:
    runs-on: ubuntu-latest
    name: Validate Multi-Environment Build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all build modes
        run: |
          echo "Testing all supported build modes..."
          VITE_APP_ENV=development pnpm run build:dev
          rm -rf dist
          VITE_APP_ENV=test pnpm run build:test
          rm -rf dist
          VITE_APP_ENV=staging pnpm run build:staging
          rm -rf dist
          VITE_APP_ENV=production pnpm run build:prod
          echo "All environment builds successful!"

  build-and-push:
    needs: validate-build
    environment: "${{ github.ref_name == 'master' && 'PRODUCTION' || github.ref_name == 'main' && 'PRODUCTION' || github.ref_name == 'staging' && 'STAGING' || 'TEST' }}"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    env:
      BUILD_ENV: "${{ github.ref_name == 'master' && 'production' || github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'test' }}"
      APP_ENV: "${{ vars.VITE_APP_ENV != '' && vars.VITE_APP_ENV || (github.ref_name == 'master' && 'production' || github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'test') }}"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Digital Ocean CLI
        run: |
          sudo snap install doctl
          sudo snap connect doctl:dot-docker
          doctl version

      - name: Build Docker Image
        run: |
          echo "*********** Build Crypto Map 360 Frontend ***********"
          export DIGITALOCEAN_ACCESS_TOKEN=${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          doctl auth init
          doctl registry login
          echo "Build environment: $BUILD_ENV"
          docker build \
            --file ./Dockerfile \
            --build-arg BUILD_ENV="$BUILD_ENV" \
            --build-arg VITE_APP_ENV="$APP_ENV" \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_DATA_SOURCE="${{ vars.VITE_DATA_SOURCE }}" \
            --build-arg VITE_ENABLE_DEMO_TOOLS="${{ vars.VITE_ENABLE_DEMO_TOOLS }}" \
            --build-arg VITE_SENTRY_ENV="${{ vars.VITE_SENTRY_ENV }}" \
            --build-arg VITE_SENTRY_DSN="${{ secrets.VITE_SENTRY_DSN }}" \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="${{ vars.VITE_GOOGLE_MAPS_API_KEY }}" \
            --build-arg VITE_MAPBOX_TOKEN="${{ vars.VITE_MAPBOX_TOKEN }}" \
            --build-arg VITE_MAP_MARKER_ENGINE="${{ vars.VITE_MAP_MARKER_ENGINE }}" \
            --build-arg VITE_GOOGLE_MAPS_MAP_ID="${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}" \
            --build-arg VITE_VLINKPAY_WEB_URL_BASE="${{ vars.VITE_VLINKPAY_WEB_URL_BASE }}" \
            --tag $REGISTRY/$IMAGE_NAME:${{ github.ref_name }}-${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          echo "*********** Push Crypto Map 360 Frontend ***********"
          docker push $REGISTRY/$IMAGE_NAME:${{ github.ref_name }}-${{ github.sha }}

  deploy:
    environment: "${{ github.ref_name == 'master' && 'PRODUCTION' || github.ref_name == 'main' && 'PRODUCTION' || github.ref_name == 'staging' && 'STAGING' || 'TEST' }}"
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to ArgoCD
    steps:
      - name: Checkout ArgoCD Repository
        uses: actions/checkout@v4
        with:
          repository: "vlink-group/devops"
          token: ${{ secrets.GH_PAT }}
          path: "devops"
          ref: "argocd"

      - name: Update Deployment Manifest
        run: |
          echo "Updating deployment for Crypto Map 360 Frontend"
          echo "Branch: ${{ github.ref_name }}, SHA: ${{ github.sha }}"
          sed -i 's|:${{ github.ref_name }}-.*|:${{ github.ref_name }}-${{ github.sha }}|g' devops/argocd/${{ github.ref_name }}/app-crypto-map-360-frontend/deployment.yaml

      - name: Commit and Push Changes
        run: |
          cd devops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update Crypto Map 360 Frontend deployment image to ${{ github.sha }}"
          git push
